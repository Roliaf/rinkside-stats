  --num:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --sans:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220; --panel:#141D2C; --panel2:#18233A; --ink:#E8EEF6; --ink2:#C9D4E2; --muted:#9FB0C6;
    --line:#26334A; --line2:#1E2A3E; --field:#0F172A; --fieldline:#33445E; --accent:#60A5FA; --accentink:#0B1220;
    --rail:#060B14; --railink:#AFC0D6; --warnbg:#3D2E07; --warnink:#FDE68A; --okbg:#0E2E1C; --okink:#BBF7D0;
    --sel:#16264A; --chipoff:#1C2638; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1220; --panel:#141D2C; --panel2:#18233A; --ink:#E8EEF6; --ink2:#C9D4E2; --muted:#9FB0C6;
  --line:#26334A; --line2:#1E2A3E; --field:#0F172A; --fieldline:#33445E; --accent:#60A5FA; --accentink:#0B1220;
  --rail:#060B14; --railink:#AFC0D6; --warnbg:#3D2E07; --warnink:#FDE68A; --okbg:#0E2E1C; --okink:#BBF7D0;
  --sel:#16264A; --chipoff:#1C2638; color-scheme: dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #F59E0B;outline-offset:2px}
a{color:var(--accent)}
.hidden{display:none!important}
.num{font-family:var(--num);font-weight:800}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.rail{width:84px;flex-shrink:0;background:var(--rail);padding:14px 10px;display:flex;flex-direction:column;gap:8px;position:sticky;top:0;height:100vh}
.rail button{height:64px;border-radius:12px;border:0;background:transparent;color:var(--railink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700}
.rail button.on{background:#1E293B;color:#FFFFFF}
.rail button svg{width:22px;height:22px}
.rail .live{background:#E69F00;color:#0F172A}
.content{flex:1;min-width:0;padding:22px 24px 40px}
h1{margin:0;font-size:24px}
h2{margin:0;font-size:18px}
.panel{background:var(--panel);border-radius:18px;padding:18px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{height:46px;padding:0 16px;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accentink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{border-color:var(--fieldline);color:var(--ink2)}
.btn.danger{border-color:#DC2626;color:#DC2626}
.btn.dashed{border:2px dashed var(--fieldline);color:var(--ink2);background:var(--panel2);width:100%}
.btn.sm{height:38px;padding:0 12px;font-size:13px;border-radius:10px}
.iconbtn{width:44px;height:44px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.iconbtn svg{width:18px;height:18px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink2)}
.in{height:46px;border-radius:10px;border:1.5px solid var(--fieldline);background:var(--field);padding:0 12px;font-size:15px;color:var(--ink);min-width:0;width:100%}
textarea.in{height:auto;padding:10px 12px;line-height:1.4}
select.in{padding:0 8px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;height:46px}
.seg button{flex:1;border:0;border-radius:8px;background:transparent;font-weight:600;color:var(--muted);padding:0 8px;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--ink);font-weight:800;box-shadow:0 1px 3px rgba(15,23,42,.18)}
.toggle{width:52px;height:30px;border-radius:15px;border:0;background:var(--fieldline);position:relative;flex-shrink:0;padding:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#FFFFFF;transition:left .15s}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:25px}
.pill{height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:22px;font-size:14px;font-weight:600;background:var(--panel2);color:var(--muted);border:1.5px solid var(--line)}
.pill.on{background:#DBEAFE;color:#1E3A8A;border-color:#93C5FD}
.warn{background:var(--warnbg);color:var(--warnink);border-radius:10px;padding:10px 12px;font-size:14px}
.ok{background:var(--okbg);color:var(--okink);border-radius:10px;padding:10px 12px;font-size:14px}
.logo{border-radius:50%;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:800;flex-shrink:0;overflow:hidden;vertical-align:middle}
.logo img{width:86%;height:86%;object-fit:contain}
.tbl{width:100%;border-collapse:collapse}
.scrollx{overflow-x:auto}
.empty{border:2px dashed var(--fieldline);border-radius:16px;padding:28px;text-align:center;color:var(--muted)}

/* ---------- teams ---------- */
.teams{display:flex;gap:0;min-height:100vh}
.schools{width:290px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:8px}
.schools.collapsed{width:72px;padding:18px 8px}
.schools .lbl{font-size:12px;font-weight:700;color:var(--muted);margin-top:8px}
.school{min-height:54px;border-radius:12px;display:flex;align-items:center;gap:10px;padding:6px 10px;text-align:left;border:2px solid transparent;background:transparent;width:100%}
.school.on{background:var(--sel);border-color:var(--accent)}
.school .nm{font-weight:700;font-size:15px}
.school .sub{font-size:12px;color:var(--muted)}
.teamdetail{flex:1;min-width:0;padding:22px 24px 40px;display:flex;flex-direction:column;gap:18px}
.rgrid{display:grid;grid-template-columns:64px minmax(110px,1.2fr) minmax(100px,1fr) 70px 76px 64px minmax(120px,1.4fr) 44px;gap:8px;align-items:center}
.rgrid .in{height:42px;font-size:14px;padding:0 8px}
.rhead{font-size:12px;font-weight:700;color:var(--muted);padding:8px 0;border-bottom:1px solid var(--line)}
.rrow{padding:5px 0;border-bottom:1px solid var(--line2)}
.rrow.dup{background:var(--warnbg)}
.rrow.inactive .in{opacity:.6}
.cgrid{display:grid;grid-template-columns:minmax(110px,1.2fr) minmax(100px,1fr) minmax(110px,1fr) minmax(140px,1.4fr) 64px 44px;gap:8px;align-items:center}
.cgrid .in{height:42px;font-size:14px;padding:0 8px}
.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.swatch.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.cpanel{background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.lbl2{font-size:12px;font-weight:700;color:var(--muted)}
.cgridc{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:6px}
.cchip{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:6px;padding:0 6px;text-align:left;min-width:0}
.cchip span{width:26px;height:26px;border-radius:7px;border:1px solid #94A3B8;flex-shrink:0}
.cchip em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cchip.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.swatch{height:64px;border-radius:12px;border:1.5px solid var(--fieldline);background:var(--field);display:flex;align-items:center;gap:8px;padding:0 8px;position:relative;min-width:0;text-align:left}
.swatch input[type=color]{width:42px;height:42px;border:1.5px solid #94A3B8;border-radius:10px;padding:0;background:none;flex-shrink:0}
.swatch input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.swatch input[type=color]::-webkit-color-swatch{border:0;border-radius:8px}
.chipprev{width:86px;height:82px;border-radius:11px;padding:5px 7px;display:flex;flex-direction:column;justify-content:space-between}

/* ---------- games ---------- */
.games{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.gcard{border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;background:var(--panel);border:2px solid transparent;width:100%;color:var(--ink)}
.gcard.on{border-color:var(--accent)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.dchip{height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden;border:1.5px solid rgba(100,116,139,.45)}
.dchip .n{font-family:var(--num);font-weight:800;font-size:20px;line-height:1}
.dchip .l{font-size:9px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.dchip.out{background:var(--chipoff)!important;color:var(--muted)!important;text-decoration:line-through;border:1.5px dashed var(--fieldline)}
.netpick{display:grid;grid-template-columns:1fr 1fr;height:92px;border:3px solid #9AA4B1;border-radius:46px;overflow:hidden;background:#F7FAFC}
.netpick button{border:0;background:#F7FAFC;color:#475569;font-weight:700;font-size:14px}
.netpick button:first-child{border-right:4px solid #D62828}

@media (max-width: 900px){
  .games{grid-template-columns:1fr}
  .g3{grid-template-columns:1fr 1fr}
  .schools{width:220px}
  .swatches{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width: 640px){
  .rail{width:64px;padding:10px 6px}
  .content,.teamdetail{padding:16px 12px 40px}
  .teams{flex-direction:column}
  .schools{width:auto;border-right:0;border-bottom:1px solid var(--line)}
  .g3,.g2{grid-template-columns:1fr}
}

/* ---------- game screen ---------- */
.game{--gbg:#0E1420;--gink:#F1F5F9;--gmut:#B6C2D3;--gp1:#182234;--gp2:#141D2C;--gp3:#22304A;--gbd:#3B4A60;--gline:#243042;--gteam:#1B2638;--gundo:#FDE68A;--gchipbd:rgba(255,255,255,.12)}
.game.light{--gbg:#CFD8E3;--gink:#0F172A;--gmut:#334155;--gp1:#F8FAFC;--gp2:#EEF2F6;--gp3:#FFFFFF;--gbd:#94A3B8;--gline:#AAB7C7;--gteam:#F8FAFC;--gundo:#92400E;--gchipbd:rgba(15,23,42,.28)}
.game{position:fixed;inset:0;background:var(--gbg);color:var(--gink);display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.ghead{height:74px;flex-shrink:0;padding:8px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;border-bottom:1px solid var(--gline)}
.gteam{display:flex;align-items:center;gap:10px;min-width:0}
.gteam .nm{font-family:var(--num);font-weight:800;font-size:24px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gteam .st{font-size:12px;color:var(--gmut);white-space:nowrap}
.gteam .sc{font-family:var(--num);font-weight:800;font-size:48px;line-height:1}
.pbtn{min-width:46px;height:44px;border-radius:10px;font-family:var(--num);font-weight:800;font-size:19px;background:var(--gp1);color:var(--gmut);border:2px solid var(--gbd);padding:0 6px}
.menubtn{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--gbd);background:var(--gp1);color:var(--gink);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.gmain{flex:1;min-height:0;padding:10px 14px;display:grid;grid-template-columns:minmax(0,1fr) 300px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:10px 12px}
.zonewrap{position:relative;aspect-ratio:444/340;max-height:46vh;width:100%;justify-self:center}
.zone{position:absolute;inset:0;padding:0;margin:0;overflow:hidden;background:#F7FAFC;border:4px solid #9AA4B1;cursor:crosshair;display:block;width:100%;height:100%}
.zone.L{border-radius:27% 6px 6px 27% / 35% 6px 6px 35%}
.zone.R{border-radius:6px 27% 27% 6px / 6px 35% 35% 6px}
.zone.pend{border-color:#FFFFFF}
.zone span{position:absolute;display:block;pointer-events:none}
.zlabel{top:8px;font-size:11px;font-weight:800;color:#FFFFFF;border-radius:6px;padding:4px 8px;white-space:nowrap;display:flex!important;align-items:center;gap:6px}
.mk{box-sizing:border-box;display:flex!important;align-items:center;justify-content:center;font-family:var(--num);font-weight:800;color:#0F172A;transform:translate(-50%,-50%)}
.pop{position:absolute;z-index:6;width:212px;background:#FFFFFF;color:#0F172A;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 14px 34px rgba(0,0,0,.45);border:2px solid #0F172A}
.pop .rb{height:46px;border-radius:10px;font-weight:800;font-size:14px;border:3px solid transparent}
.center{grid-column:2;grid-row:1/span 2;display:flex;flex-direction:column;gap:9px;min-height:0;overflow:auto}
.hint{border-radius:12px;padding:7px 10px;display:flex;align-items:center;gap:8px;font-size:12.5px;line-height:1.3}
.hint>span{flex:1}
.hint b{letter-spacing:.04em}
.hintbtn{height:34px;border-radius:8px;border:2px solid currentColor;background:transparent;color:inherit;font-weight:800;font-size:12px;padding:0 8px;flex-shrink:0}
.big3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.small4{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:5px}
.small4 button{height:40px;border-radius:10px;border:1.5px solid var(--gbd);background:var(--gp1);color:var(--gink);font-weight:700;font-size:12px}
.small4 button.on{background:var(--gink);color:var(--gbg)}
.rundown{display:flex;flex-direction:column;gap:3px;min-height:0;overflow-y:auto;flex:1 1 0;padding-right:2px}
.rundown .lbl{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--gmut);position:sticky;top:0;background:var(--gbg);padding:2px 0;z-index:1}
.rdsep{font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:6px 2px 1px}
.rev .tm{width:36px;flex-shrink:0;font-size:11.5px;color:var(--gmut);font-variant-numeric:tabular-nums;text-align:right}
.pchip{font-size:10px;font-weight:800;color:#0F172A;border-radius:4px;padding:1px 4px;flex-shrink:0}
.chip.innet{box-shadow:0 0 0 3px #22C55E,inset 0 0 0 2px #22C55E}
.chip.innet .g{color:#16A34A;background:#FFFFFF;border-radius:4px;padding:0 3px;opacity:1}
.rev.sys{background:transparent;border:1px dashed var(--gbd)}
.rev.ins{outline:2px solid #FBBF24}
.rev.sel{outline:2px solid #A78BFA}
.tag{font-size:11px;font-weight:800;color:#FFFFFF;border-radius:6px;padding:3px 7px}
.gslot{border:2px solid #CBD5E1;border-radius:12px;padding:6px 8px;display:flex;flex-direction:column;gap:5px;background:#FFFFFF}
.gslot.on{border-color:#16A34A;box-shadow:0 0 0 2px #BBF7D0}
.gval{border:0;background:transparent;text-align:left;display:flex;flex-direction:column;gap:1px;padding:0;color:#0F172A}
.gval b{font-size:15px}
.forink{position:relative;width:min(100%,calc(34vh * 200 / 85));aspect-ratio:200/85;margin:0 auto}
.forink .zone{position:absolute;inset:0}
.fodot{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid #0F172A;background:rgba(214,40,40,.18);z-index:3}
.fodot::after{content:"";position:absolute;inset:13px;border-radius:50%;background:#D62828}
.fodot.on{background:#FBBF24;box-shadow:0 0 0 4px rgba(251,191,36,.45)}
.fomenu{display:flex;flex-direction:column;gap:8px}
.focgrid{display:flex;flex-direction:column;gap:6px;min-width:0}
.fonums{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px}
.fonum{height:44px;border-radius:9px;border:1.5px solid #94A3B8;font-family:var(--num);font-weight:800;font-size:21px}
.fonum.unk{background:#F1F5F9!important;color:#475569!important}
.fonum.on{outline:3px solid #F59E0B;outline-offset:1px}
.need{font-size:11px;font-weight:800;color:#B45309;background:#FEF3C7;border-radius:5px;padding:1px 6px}
.fowin{height:58px;border-radius:12px;border:3px solid;font-family:var(--num);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;gap:8px}
.opt:disabled,button:disabled{cursor:default}
.bigbtn{height:46px;border-radius:12px;font-family:var(--num);font-weight:800;font-size:18px;letter-spacing:0;padding:0 2px;border:3px solid transparent;flex-shrink:0;min-width:0}
.big2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;flex-shrink:0}
.small3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.small3 button{height:44px;border-radius:10px;border:1.5px solid #3B4A60;background:#182234;color:#E5EAF1;font-weight:700;font-size:12px}
.small3 button.on{background:#F1F5F9;color:#0F172A}
.recent{display:flex;flex-direction:column;gap:5px;min-height:0;overflow-y:auto;flex:1 1 0}
.center>*{flex-shrink:0}
.center>.recent{flex-shrink:1}
.recent .lbl{font-size:11px;font-weight:800;letter-spacing:.08em;color:#B6C2D3}
.rev{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:var(--gp2);color:var(--gink);border:1px solid var(--gline);text-align:left;width:100%}
.rev.first{background:#22304A}
.rev .t1{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rev .t2{font-size:11px;color:var(--gmut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:grid;gap:6px;min-height:0;grid-auto-rows:minmax(0,1fr)}
.chip{border-radius:11px;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-width:0;min-height:0;text-align:left;border:2px solid var(--gchipbd);transition:opacity .15s;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.chip .top{display:flex;justify-content:space-between;align-items:flex-start;width:100%}
.chip .n{font-family:var(--num);font-weight:800;font-size:clamp(30px,6.4vh,56px);line-height:1;letter-spacing:.01em}
.chip .g{position:absolute;top:3px;right:5px;font-size:11px;font-weight:800;opacity:.85}
.chip .logo{width:min(70%,7vh);height:min(70%,7vh);aspect-ratio:1}
.chip .ta{font-size:9.5px;font-weight:700;opacity:.85;white-space:nowrap}
.chip .l{font-weight:800;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;font-size:12px}
.chip .f{font-size:10.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.chip.dim{opacity:.28}
.chip.hi{border:3px solid var(--gink)}
.chip.arr{border:2px dashed #FFFFFF;touch-action:none}
.chip.dragging{opacity:.5;outline:3px solid #F59E0B}
.chip.droptarget{outline:3px solid #22C55E}
.sheet{flex:1;display:flex;flex-direction:column;gap:9px;background:#F8FAFC;color:#0F172A;border-radius:16px;padding:12px;min-height:0;overflow:auto}
.sheet .lbl{font-size:11px;font-weight:800;letter-spacing:.06em;color:#475569}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(5,9,16,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#FFFFFF;color:#0F172A;border-radius:22px;padding:22px 24px;width:min(1080px,100%);max-height:100%;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.5)}

<script>
'use strict';
/* =========================================================
   Rinkside Stats — core: storage, helpers, model
   ========================================================= */
const KEY = 'rinkside.v1';
const PC = { P1: '#56B4E9', P2: '#E69F00', P3: '#CC79A7', OT: '#009E73', OT1: '#009E73', OT2: '#D55E00', OT3: '#0072B2', OT4: '#B8A600', OT5: '#8B5CF6', OT6: '#009E73', OT7: '#D55E00', OT8: '#0072B2', OT9: '#B8A600', SO: '#94A3B8', H1: '#56B4E9', H2: '#E69F00' };
const PD = { P1: '#1F6E9C', P2: '#9A6200', P3: '#9C4F7E', OT: '#006B4F', OT1: '#006B4F', OT2: '#9A3F00', OT3: '#00507D', OT4: '#6B6100', OT5: '#5B21B6', OT6: '#006B4F', OT7: '#9A3F00', OT8: '#00507D', OT9: '#6B6100', SO: '#475569', H1: '#1F6E9C', H2: '#9A6200' };
const RESULTS = [['On net', '#38BDF8', '#0B2533'], ['Missed', '#E2E8F0', '#0F172A'], ['Blocked', '#94A3B8', '#0F172A'], ['Goal', '#22C55E', '#052E16']];
const INFRACTIONS = ['Tripping', 'Hooking', 'Slashing', 'Holding', 'Roughing', 'Interference', 'Cross-check', 'High stick', 'Boarding', 'Too many men', 'Unsportsmanlike', 'Other'];
const POSITIONS = ['F', 'D', 'G', 'C', 'LW', 'RW'];
const GRADES = ['', '7', '8', '9', '10', '11', '12'];

let db = null;
const ui = { view: 'games', teamId: null, gameId: null, teamSearch: '', schoolsCollapsed: false, g: {}, sheet: null, toast: null, reportUpto: null };

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function emptyDb() { return { v: 1, teams: [], games: [], settings: { trackerName: '' } }; }
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) { console.warn('load failed', e); }
  return null;
}
let saveFailed = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); saveFailed = false; }
  catch (e) { if (!saveFailed) { saveFailed = true; toast('Couldn’t save to this tablet’s storage. Export a backup from Settings.'); } }
}
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fmtDate(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
function fmtTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  const ap = h >= 12 ? 'PM' : 'AM';
  return ((h + 11) % 12 + 1) + ':' + String(m).padStart(2, '0') + ' ' + ap;
}

/* ---------- color helpers ---------- */
function hexRgb(h) { h = (h || '#000000').replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function lum(h) { const c = hexRgb(h).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
function contrast(a, b) { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
function readable(bg) { return contrast(bg, '#FFFFFF') >= contrast(bg, '#0F172A') ? '#FFFFFF' : '#0F172A'; }
function accentOn(bg, pref) { return contrast(bg, pref) >= 3 ? pref : readable(bg); }
function colorDist(a, b) { const x = hexRgb(a), y = hexRgb(b); return Math.sqrt((x[0] - y[0]) ** 2 + (x[1] - y[1]) ** 2 + (x[2] - y[2]) ** 2); }
function rgbHex(r, g, b) { return '#' + [r, g, b].map((v) => Math.round(v).toString(16).padStart(2, '0')).join('').toUpperCase(); }

/* ---------- model ---------- */
function newTeam(name) {
  const short = (name || 'Team').trim().split(/\s+/).pop().toUpperCase();
  return { id: uid(), name: name || 'New team', short, logo: null, colors: { pri: '#1E3A8A', sec: '#FBBF24', alt: '#FFFFFF', home: '#1E3A8A', away: '#FFFFFF' }, starred: false, players: [], coaches: [], others: [], chipOrder: [] };
}
function newPlayer(o) { return Object.assign({ id: uid(), num: '', last: '', first: '', pos: 'F', grade: '', active: true, notes: '' }, o || {}); }
function teamById(id) { return db.teams.find((t) => t.id === id) || null; }
function gameById(id) { return db.games.find((g) => g.id === id) || null; }
function monoOf(team) {
  if (!team) return '?';
  const w = (team.short || team.name || '?').trim().split(/\s+/);
  return (w.length > 1 ? w[0][0] + w[1][0] : w[0][0]).toUpperCase();
}
function tc(s) { return String(s || '').toLowerCase().replace(/(^|[\s-])([a-z])/g, (m, a, b) => a + b.toUpperCase()); }
function nice(team) { return team ? tc(team.short || team.name) : ''; }
function logoHTML(team, size, ring) {
  size = size || 34;
  if (!team) return '<span class="logo" style="width:' + size + 'px;height:' + size + 'px;background:#94A3B8"></span>';
  const c = team.colors;
  const bw = Math.max(2, Math.round(size / 18));
  const st = 'width:' + size + 'px;height:' + size + 'px;background:' + c.pri + ';color:' + accentOn(c.pri, c.sec) + ';border:' + bw + 'px solid ' + (ring === false ? c.pri : c.sec) + ';font-size:' + Math.round(size * 0.42) + 'px';
  if (team.logo) return '<span class="logo" role="img" aria-label="' + esc(team.name) + ' logo" style="' + st + ';background:#FFFFFF url(' + team.logo + ') no-repeat center;background-size:80% 80%;background-size:contain;background-origin:content-box;padding:' + Math.max(2, Math.round(size * 0.08)) + 'px"></span>';
  return '<span class="logo" style="' + st + '">' + esc(monoOf(team)) + '</span>';
}
function sortedPlayers(team) {
  return team.players.slice().sort((a, b) => (parseInt(a.num, 10) || 999) - (parseInt(b.num, 10) || 999) || String(a.last).localeCompare(String(b.last)));
}
function playerName(p, fmt) {
  if (!p) return '';
  if (fmt === 'lf') return p.last ? p.last + (p.first ? ', ' + p.first : '') : '';
  return [p.first, p.last].filter(Boolean).join(' ');
}

function newGame(myTeamId) {
  const g = {
    id: uid(), myTeamId, oppTeamId: null, home: true, date: today(), time: '', rink: '',
    format: '3P', periodLen: 17, otLen: 8, otCount: 1, so: false, firstNet: 'R',
    track: { hits: true, tos: true, pens: true, assists: true, goalies: true },
    dressed: {}, goalies: { m: null, o: null },
    period: null, flip: false, events: [], sent: {}, status: 'upcoming', created: Date.now(), mig: 2, notes: ''
  };
  return g;
}
function periodsOf(g) {
  const reg = g.format === '2H' ? ['H1', 'H2'] : ['P1', 'P2', 'P3'];
  const n = otCountOf(g);
  const ots = n === 1 ? ['OT'] : Array.from({ length: n }, (_, i) => 'OT' + (i + 1));
  return reg.concat(ots, g.so ? ['SO'] : []);
}
function otCountOf(g) {
  if (g.otCount == null) { g.otCount = g.tie === 'none' ? 0 : 1; g.so = g.tie === 'OTSO'; delete g.tie; }
  return Math.max(0, Math.min(9, g.otCount | 0));
}
function setOtCount(g, n) {
  n = Math.max(0, Math.min(9, n));
  const cur = otCountOf(g);
  const keep = periodsOf(g);
  const fromLabel = (p) => (p === 'OT' ? 1 : isOT(p) ? +p.slice(2) : 0);
  const used = g.events.map((e) => fromLabel(e.period)).concat(Object.keys(g.sent).map(fromLabel), [fromLabel(g.period || '')]);
  if (n < Math.max(0, ...used)) return false;
  const lab = (k) => (n === 1 ? 'OT' : 'OT' + k);
  const remap = (p) => { const k = fromLabel(p); return k ? lab(k) : p; };
  g.events.forEach((e) => { e.period = remap(e.period); });
  const sent = {}; Object.keys(g.sent).forEach((k) => { sent[remap(k)] = g.sent[k]; }); g.sent = sent;
  if (g.period) g.period = remap(g.period);
  g.otCount = n;
  return true;
}
function isOT(p) { return /^OT\d?$/.test(p);
}
function regPeriods(g) { return g.format === '2H' ? ['H1', 'H2'] : ['P1', 'P2', 'P3']; }
function periodName(p) { const n = { P1: '1st period', P2: '2nd period', P3: '3rd period', H1: '1st half', H2: '2nd half', OT: 'overtime', SO: 'shootout' }[p]; if (n) return n; const m = /^OT(\d)$/.exec(p); if (m) return ['', '1st', '2nd', '3rd'][+m[1]] ? ['', '1st', '2nd', '3rd'][+m[1]] + ' overtime' : m[1] + 'th overtime'; return p; }
function periodLenSec(g, p) { return (isOT(p) ? (g.otLen || 8) : p === 'SO' ? 0 : g.periodLen || 17) * 60; }
function gTeam(g, side) { return teamById(side === 'm' ? g.myTeamId : g.oppTeamId); }
function dressedIds(g, team) {
  if (!team) return [];
  if (!g.dressed[team.id]) g.dressed[team.id] = team.players.filter((p) => p.active).map((p) => p.id);
  return g.dressed[team.id].filter((id) => team.players.some((p) => p.id === id));
}
function jersey(g, side) {
  const t = gTeam(g, side); if (!t) return '#64748B';
  const isHome = side === 'm' ? g.home : !g.home;
  return isHome ? t.colors.home : t.colors.away;
}
function playerOf(g, side, pid) {
  if (pid === 'TEAM') return null;
  const t = gTeam(g, side); return t ? t.players.find((p) => p.id === pid) || null : null;
}
function evWho(g, e, fmt) {
  if (e.pid === 'TEAM') return (gTeam(g, e.t) || {}).short ? gTeam(g, e.t).short + ' (team)' : 'Team';
  const p = playerOf(g, e.t, e.pid);
  if (!p) return 'Unknown';
  return '#' + p.num + (p.last ? ' ' + (fmt === 'upper' ? p.last.toUpperCase() : p.last) : '');
}
function clockFmt(d) { if (!d) return '--:--'; const p = d.padStart(3, '0'); return parseInt(p.slice(0, -2), 10) + ':' + p.slice(-2); }
function clockSecs(d) { if (!d) return null; const p = d.padStart(3, '0'); return parseInt(p.slice(0, -2), 10) * 60 + parseInt(p.slice(-2), 10); }
function secsFmt(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

/* ---------- time helpers ---------- */
function parseAt(at) { const m = /^(\d{1,2}):(\d{2})$/.exec(at || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; }
function atDigits(at) { const s = parseAt(at); return s == null ? '' : String(Math.floor(s / 60)) + String(s % 60).padStart(2, '0'); }
function periodBase(g) { const b = {}; let acc = 0; periodsOf(g).forEach((p) => { b[p] = acc; acc += periodLenSec(g, p); }); return b; }
function elapsedAt(g, base, p, at) { const s = parseAt(at); if (s == null || base[p] == null) return null; return base[p] + Math.max(0, periodLenSec(g, p) - s); }
function fmtElapsed(g, base, el) {
  const ps = periodsOf(g);
  for (let i = 0; i < ps.length; i++) { const p = ps[i], len = periodLenSec(g, p); if (el < base[p] + len || i === ps.length - 1) return { at: secsFmt(Math.max(0, Math.round(base[p] + len - el))), p }; }
  return { at: '', p: '' };
}
function goalieNow(g, side) {
  let cur = g.goalies[side] || null;
  g.events.forEach((e) => { if (e.type === 'goalie' && e.t === side) cur = e.gk; });
  return cur;
}

/* ---------- strength: replayed from the event list ---------- */
function replay(g, n) {
  const evs = n == null ? g.events : g.events.slice(0, n);
  const base = periodBase(g);
  const tags = {}; const ppo = { m: 0, o: 0 }; const pens = []; const pulled = { m: false, o: false };
  const gk = { m: g.goalies.m || null, o: g.goalies.o || null };
  const tracked = { m: g.goalies.m != null || evs.some((x) => x.type === 'goalie' && x.t === 'm'), o: g.goalies.o != null || evs.some((x) => x.type === 'goalie' && x.t === 'o') };
  let ov = null, now = 0, curP = null, adv = null, lastTimed = -1, lastAt = '';
  const eff = () => { const c = { m: 0, o: 0 }; pens.forEach((p) => { if (!p.coinc) c[p.t]++; }); return c; };
  const advSide = () => { if (ov) return ov.m > ov.o ? 'm' : ov.o > ov.m ? 'o' : null; const c = eff(); return c.m < c.o ? 'm' : c.o < c.m ? 'o' : null; };
  const sk = () => { if (ov) return { m: ov.m, o: ov.o }; const c = eff(); return { m: 5 - Math.min(2, c.m) + (pulled.m ? 1 : 0), o: 5 - Math.min(2, c.o) + (pulled.o ? 1 : 0) }; };
  const counted = {};
  const checkAdv = () => {
    const a = advSide();
    if (a && !ov) pens.forEach((p) => { if (!p.coinc && p.t !== a && !counted[p.id]) { counted[p.id] = 1; ppo[a]++; } });
    else if (a && a !== adv) ppo[a]++;
    adv = a;
  };
  const advanceTo = (to) => {
    for (;;) {
      let nx = null; pens.forEach((p) => { if (p.exp != null && p.exp <= to && (!nx || p.exp < nx.exp)) nx = p; });
      if (!nx) break;
      now = Math.max(now, nx.exp); pens.splice(pens.indexOf(nx), 1); checkAdv();
    }
    now = Math.max(now, to);
  };
  const endPen = (p) => { const i = pens.indexOf(p); if (i >= 0) pens.splice(i, 1); };
  for (let i = 0; i < evs.length; i++) {
    const e = evs[i];
    if (e.period !== curP) { curP = e.period; if (base[curP] != null && base[curP] > now) advanceTo(base[curP]); }
    const t = elapsedAt(g, base, e.period, e.at);
    if (t != null) { if (t > now) advanceTo(t); lastTimed = i; lastAt = e.at; }
    if (e.type !== 'pen') checkAdv();
    const a = advSide(), s = sk();
    const tg = { m: a === 'm' ? 'PP' : a === 'o' ? 'SH' : 'EV', o: a === 'o' ? 'PP' : a === 'm' ? 'SH' : 'EV', label: s.m + 'v' + s.o };
    if (e.strOv === 'EV' || e.strOv === 'PP' || e.strOv === 'SH') { tg[e.t] = e.strOv; tg[e.t === 'm' ? 'o' : 'm'] = e.strOv === 'PP' ? 'SH' : e.strOv === 'SH' ? 'PP' : 'EV'; tg.manual = true; }
    tags[e.id] = tg;
    if (e.type === 'pen') {
      if (e.min !== 10) {
        const p = { id: e.id, t: e.t, pid: e.pid, inf: e.inf, min: e.min, at: e.at || '', period: e.period, start: t, exp: t == null ? null : t + (e.min === 4 ? 120 : e.min * 60), dbl: e.min === 4, half: false, coinc: false };
        const prev = evs[i - 1];
        const mate = pens.find((q) => !q.coinc && q.t !== e.t && q.min === e.min && q.period === e.period && ((q.at && q.at === p.at) || (!q.at && !p.at && prev && prev.id === q.id)));
        if (mate) { mate.coinc = true; p.coinc = true; }
        pens.push(p);
      }
      const nx = evs[i + 1];
      if (!(nx && nx.type === 'pen' && nx.period === e.period && (nx.at || '') === (e.at || ''))) checkAdv();
    } else if (e.type === 'shot' && e.result === 'Goal') {
      const opp = e.t === 'm' ? 'o' : 'm';
      tg.en = tracked[opp] && gk[opp] === null;
      if (!ov && !tg.manual && a === e.t) {
        const p = pens.filter((q) => !q.coinc && q.t === opp && (q.min === 2 || q.min === 4)).sort((x, y) => (x.exp == null ? 1e9 : x.exp) - (y.exp == null ? 1e9 : y.exp))[0];
        if (p) { if (p.dbl && !p.half) { p.half = true; p.exp = (t == null ? now : t) + 120; } else endPen(p); tg.endedPen = p.id; }

    insertPPEnd(g, idx, [el.dataset.v]); toast('Power play ended after this line. Later entries were re-tagged.'); render();
  },
  insertAfter() { ui.g.insertAfter = ui.g.fixId; ui.g.sheet = null; toast('New entries will go after that line.'); render(); },
  doneInsert() { ui.g.insertAfter = null; render(); },
  flipIce() { const g = curGame(); g.flip = !g.flip; ui.g.pending = null; save(); toast('Ice flipped.'); render(); },
  arrange() { ui.g.arrange = !ui.g.arrange; ui.g.pending = null; ui.g.mode = ''; render(); },
  addOT() { const g = curGame(); setOtCount(g, otCountOf(g) + 1); save(); const added = periodsOf(g).filter((p) => isOT(p)).pop(); toast(periodName(added).replace(/^./, (c) => c.toUpperCase()) + ' added.'); render(); },
  setPeriod(el) {
    const g = curGame(); const p = el.dataset.p; if (p === g.period) return;
    g.period = p; ui.g.pending = null; save(); toast(periodName(p).replace(/^./, (c) => c.toUpperCase()) + ' · ice matched'); render();
  },
  undo() {
    const g = curGame();
    let bi = -1, bt = -1; g.events.forEach((e, i) => { if ((e.ts || 0) >= bt) { bt = e.ts || 0; bi = i; } });
    if (bi < 0) { toast('Nothing to undo.'); return; }
    const e = g.events[bi];
    if (ui.g.insertAfter === e.id) ui.g.insertAfter = bi > 0 ? g.events[bi - 1].id : null;
    g.events.splice(bi, 1);
    save(); ui.g.pending = null; ui.g.reassign = null; ui.g.flash = '';
    toast('Removed: ' + rowText(g, e, null).t1);
    render();
  },
  fix(el) { ui.g.sheet = 'fix'; ui.g.fixId = el.dataset.id; ui.g.fixT = null; ui.g.pending = null; ui.g.mode = ''; render(); },
  fixResult(el) { const g = curGame(), e = g.events.find((x) => x.id === ui.g.fixId); if (!e) return; e.result = el.dataset.v; if (e.result !== 'Goal') { delete e.a1; delete e.a2; } save(); render(); },
  fixGoal() {
    const g = curGame(), e = g.events.find((x) => x.id === ui.g.fixId); if (!e) return;
    ui.g.draft = { eid: e.id, t: e.t, pid: e.pid, period: e.period, clock: atDigits(e.at), touched: !!e.at, a1: e.a1, a2: e.a2, strOv: e.strOv || '', focus: null };
    ui.g.sheet = 'goal'; ui.g.fixBack = true; render();
  },
  fixMin(el) { const g = curGame(), e = g.events.find((x) => x.id === ui.g.fixId); if (!e) return; e.min = +el.dataset.v; save(); render(); },
  fixInf(el) { const g = curGame(), e = g.events.find((x) => x.id === ui.g.fixId); if (!e) return; e.inf = el.dataset.v; save(); render(); },
  fixWin(el) { const g = curGame(), e = g.events.find((x) => x.id === ui.g.fixId); if (!e) return; e.win = el.dataset.v; save(); render(); },
  fixFO() { const g = curGame(), e = g.events.find((x) => x.id === ui.g.fixId); if (!e) return; ui.g.fo = { eid: e.id, period: e.period, dot: e.dot, cm: e.cm || null, co: e.co || null, clock: atDigits(e.at), touched: false, keepAt: e.at }; ui.g.sheet = null; ui.g.fixBack = true; render(); },
  fixStr(el) { const g = curGame(), e = g.events.find((x) => x.id === ui.g.fixId); if (!e) return; e.strOv = el.dataset.v === 'AUTO' ? '' : el.dataset.v; save(); render(); },
  fixPlayer() { ui.g.reassign = ui.g.fixId; ui.g.sheet = null; render(); },
  fixMove() { ui.g.relocate = ui.g.fixId; ui.g.sheet = null; render(); },
  fixPeriod(el) { const g = curGame(), e = g.events.find((x) => x.id === ui.g.fixId); if (!e) return; e.period = el.dataset.v; save(); render(); },
  fixTimeOpen() { const g = curGame(), e = g.events.find((x) => x.id === ui.g.fixId); ui.g.fixT = { open: true, clock: atDigits(e && e.at), touched: true }; render(); },
  fixKey(el) { pressKey(ui.g.fixT, el.dataset.k); render(); },
  fixTimeClear() { const g = curGame(), e = g.events.find((x) => x.id === ui.g.fixId); if (e) { e.at = ''; save(); } ui.g.fixT = null; render(); },
  fixTimeSave() {
    const g = curGame(), e = g.events.find((x) => x.id === ui.g.fixId), F = ui.g.fixT;
    if (!e || !F.clock || !clockValid(g, F.clock, e.period)) { toast('Enter a time within the period.'); return; }
    e.at = clockFmt(F.clock); if (e.type === 'pen') delete e.end; save(); ui.g.fixT = null; render();
  },
  fixShift(el) {
    const g = curGame(); const i = g.events.findIndex((x) => x.id === ui.g.fixId); const j = i + (+el.dataset.v);
    if (i < 0 || j < 0 || j >= g.events.length) return;
    const [e] = g.events.splice(i, 1); g.events.splice(j, 0, e);
    if (g.events[j - 1] && g.events[j - 1].period !== e.period && g.events[j + 1] && g.events[j + 1].period !== e.period) e.period = g.events[j - 1].period;
    save(); render();
  },
  fixDelete() {
    const g = curGame(); const i = g.events.findIndex((x) => x.id === ui.g.fixId);
    if (i >= 0 && confirm('Delete this entry? This can’t be undone.')) {
      const id = g.events[i].id; g.events.splice(i, 1);
      g.events = g.events.filter((x) => !(x.type === 'ppend' && x.pen === id));
      if (ui.g.insertAfter === id) ui.g.insertAfter = i > 0 ? g.events[i - 1].id : null;
      save(); ui.g.sheet = null; toast('Entry deleted.');
    }
    render();
  },
  leaveGame() { ui.view = 'games'; ui.g = {}; render(); },
  gameTheme() { db.settings.gameTheme = ui.light ? 'dark' : 'light'; save(); render(); },
  async fullscreen() {
    try {
      if (document.fullscreenElement) { await document.exitFullscreen(); }
      else {
        await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
        try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch (e) { /* not supported */ }
      }
    } catch (e) { toast('This browser didn’t allow full screen. Try installing the app to the home screen.'); }
    render();
  },
  openReport() { const g = curGame(); ui.reportUpto = g.period; ui.reportFinal = false; ui.view = 'report'; render(); }
};

/* ---------- drag to arrange ---------- */
let drag = null;
document.addEventListener('pointerdown', (e) => {
  const c = e.target.closest('.chip.arr'); if (!c) return;
  drag = { el: c, side: c.dataset.side, pid: c.dataset.pid, target: null };
  c.classList.add('dragging'); c.setPointerCapture && c.setPointerCapture(e.pointerId);
  e.preventDefault();
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const over = document.elementFromPoint(e.clientX, e.clientY);
  const t = over && over.closest('.chip.arr');
  document.querySelectorAll('.droptarget').forEach((x) => x.classList.remove('droptarget'));
  if (t && t !== drag.el && t.dataset.side === drag.side) { t.classList.add('droptarget'); drag.target = t.dataset.pid; } else drag.target = null;
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.target) {
    const g = curGame(); const team = gTeam(g, d.side);
    const list = chipList(g, d.side).filter((p) => !p.team && p.pos !== 'G').map((p) => p.id);
    const from = list.indexOf(d.pid), to = list.indexOf(d.target);
    list.splice(from, 1); list.splice(to, 0, d.pid);
    const rest = (team.chipOrder || []).filter((id) => list.indexOf(id) < 0);
    team.chipOrder = list.concat(rest); save();
  }
  render();
});

const SPORT_COLORS = [['Black', '#000000'], ['White', '#FFFFFF'], ['Navy', '#13294B'], ['Royal blue', '#1D4ED8'], ['Columbia blue', '#9BCBEB'], ['Sky blue', '#41B6E6'], ['Teal', '#00788C'], ['Kelly green', '#00843D'], ['Hunter green', '#2C5234'], ['Forest green', '#154734'], ['Maroon', '#6E1E2C'], ['Cardinal', '#9D2235'], ['Red', '#C8102E'], ['Scarlet', '#BB0000'], ['Burnt orange', '#BF5700'], ['Orange', '#FF6A13'], ['Yellow', '#FFD100'], ['Athletic gold', '#FFC72C'], ['Gold', '#FFB81C'], ['Old gold', '#CFB53B'], ['Vegas gold', '#C5B358'], ['Purple', '#4F2683'], ['Pink', '#E31C79'], ['Silver', '#A2AAAD'], ['Gray', '#75787B'], ['Charcoal', '#3D4247'], ['Brown', '#4E3629'], ['Cream', '#F3E9D2']];
function colorName(hex) { const f = SPORT_COLORS.find(([, h]) => h.toLowerCase() === String(hex).toLowerCase()); return f ? f[0] : ''; }
function logoColors(t, cb) {
  if (!t.logo) return cb([]);
  ui.logoCols = ui.logoCols || {};
  if (ui.logoCols[t.id] && ui.logoCols[t.id].src === t.logo) return cb(ui.logoCols[t.id].list);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = 48; const x = c.getContext('2d'); x.drawImage(img, 0, 0, 48, 48);
    const d = x.getImageData(0, 0, 48, 48).data; const b = {};
    for (let i = 0; i < d.length; i += 4) {
      if (d[i + 3] < 128) continue;
      const r = d[i], gg = d[i + 1], bb = d[i + 2];
      const k = (r >> 5) + ',' + (gg >> 5) + ',' + (bb >> 5);
      b[k] = b[k] || { n: 0, r: 0, g: 0, b: 0 }; b[k].n++; b[k].r += r; b[k].g += gg; b[k].b += bb;
    }
    const all = Object.values(b).filter((v) => v.n > 12).sort((a, z) => z.n - a.n).map((v) => rgbHex(v.r / v.n, v.g / v.n, v.b / v.n));
    const list = []; all.forEach((h) => { if (list.length < 6 && list.every((x2) => colorDist(x2, h) > 70)) list.push(h); });
    ui.logoCols[t.id] = { src: t.logo, list }; cb(list);
  };
  img.onerror = () => cb([]);
  img.src = t.logo;
}

function pNameShort(g, t, pid) { if (!pid) return ''; if (pid === 'TEAM') return 'Team'; const p = playerOf(g, t, pid); return p ? '#' + p.num + (p.last ? ' ' + p.last : '') : '?'; }
function usedPeriods(g) {
  const all = periodsOf(g), reg = regPeriods(g);
  const stop = g.status === 'final' && g.endAt ? all.indexOf(g.endAt.period) : 99;
  return all.filter((p, i) => i <= stop && (reg.indexOf(p) >= 0 || g.events.some((e) => e.period === p) || (g.status !== 'final' && p === g.period)));
}
function reportPeriods(g, upto) {
  const all = periodsOf(g), reg = regPeriods(g);
  const idx = all.indexOf(upto);
  return usedPeriods(g).filter((p) => reg.indexOf(p) >= 0 || all.indexOf(p) <= idx);
}
let repFinal = false;
function repColor(g, side) {
  const m = gTeam(g, 'm'), o = gTeam(g, 'o'); const T = side === 'm' ? m : o;
  if (side === 'o' && colorDist(m.colors.pri, o.colors.pri) < 110) {
    const alt = [o.colors.sec, o.colors.alt].find((c) => c && colorDist(c, m.colors.pri) >= 110 && colorDist(c, '#FFFFFF') > 60);

}

}
function reportDoc(g, upto, isFinal) {

  const m = gTeam(g, 'm'), o = gTeam(g, 'o');
  const cols = reportPeriods(g, upto);

function seasonSummary(D) {

  toggleStar() { const t = curTeam(); t.starred = !t.starred; save(); render(); },

  suggestColors() {

    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 40; const x = c.getContext('2d'); x.drawImage(img, 0, 0, 40, 40);
      const d = x.getImageData(0, 0, 40, 40).data; const b = {};
      for (let i = 0; i < d.length; i += 4) {
        if (d[i + 3] < 128) continue;

        const mx = Math.max(r, gg, bb), mn = Math.min(r, gg, bb);

        b[k] = b[k] || { n: 0, r: 0, g: 0, b: 0, sat: mx - mn }; b[k].n++; b[k].r += r; b[k].g += gg; b[k].b += bb;
      }
      const list = Object.values(b).map((v) => ({ hex: rgbHex(v.r / v.n, v.g / v.n, v.b / v.n), n: v.n, sat: v.sat })).sort((a, z) => (z.n * (1 + z.sat / 128)) - (a.n * (1 + a.sat / 128)));

  toggleBulk() { ui.bulkOpen = !ui.bulkOpen; render(); if (ui.bulkOpen) setTimeout(() => { const x = document.getElementById('bulkText'); if (x) x.focus(); }, 40); },
  bulkAdd() {

      const parts = line.trim().split(/[\s,]+/).filter(Boolean); if (!parts.length) return;
      if (parts.every((x) => /^\d{1,3}$/.test(x)) && parts.length > 1) { parts.forEach((num) => { t.players.push(newPlayer({ num })); n++; }); return; }

  togglePerson(el) { const t = curTeam(); const p = t[el.dataset.k].find((x) => x.id === el.dataset.id); p.reports = !p.reports; save(); render(); },

    if (!confirm('Delete ' + t.name + '?' + (used ? ' It’s used in ' + used + ' game' + (used === 1 ? '' : 's') + ', and those games will be deleted too.' : '') + ' This can’t be undone.')) return;

  },
  /* settings */
  async exportBackup() {

    const ok = await saveFile(f);

  },
  resetAll() {

};
const CHANGE = {
  async logo(el) {
    const f = el.files && el.files[0]; if (!f) return;
    const t = curTeam();
    const url = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
    const img = new Image();
    img.onload = () => {
      const S = 256, c = document.createElement('canvas'); c.width = c.height = S; const x = c.getContext('2d');
      const r = Math.min(S / img.width, S / img.height); const w = img.width * r, h = img.height * r; x.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
      t.logo = c.toDataURL('image/png'); save(); render(); toast('Logo added. Tap Suggest from logo to match colors.');
    };
    img.onerror = () => toast('That file couldn’t be read as an image.');
    img.src = url;
  },
  async import(el) {
    const f = el.files && el.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data || !Array.isArray(data.teams) || !Array.isArray(data.games)) throw new Error('shape');
      if (!confirm('Replace everything on this tablet with this backup (' + data.teams.length + ' schools, ' + data.games.length + ' games)?')) return;
      db = migrateDb(data); db.settings = db.settings || {}; save(); ui.view = 'games'; render(); toast('Backup restored.');
    } catch (e) { toast('That file isn’t a Rinkside backup.'); }
  }
};
function onBind(el, live) {
  const b = el.dataset.bind; if (!b) return;
  const v = el.value; const parts = b.split('.');
  let rerender = !live;
  if (parts[0] === 'ui' && parts[1] === 'seasonTeam') { seasonState().teamId = v; rerender = true; }
  else if (parts[0] === 'ui' && parts[1] === 'seasonThrough') { if (v) seasonState().through = v; rerender = true; }
  else if (parts[0] === 'ui') { ui[parts[1]] = v; rerender = true; }
  else if (parts[0] === 's') { db.settings[parts[1]] = v; rerender = false; }
  else if (parts[0] === 'g') {
    const g = gameById(ui.setupId); if (!g) return;
    if (parts[1] === 'goalie') g.goalies[parts[2]] = v || null;
    else if (parts[1] === 'periodLen' || parts[1] === 'otLen') g[parts[1]] = Math.max(1, Math.min(30, parseInt(v, 10) || 1));
    else g[parts[1]] = v;
  } else if (parts[0] === 't') { const t = curTeam(); t[parts[1]] = parts[1] === 'short' ? v.toUpperCase() : v; if (parts[1] === 'name' && (!t.short || t.short === 'NEW' || t.short === 'SCHOOL' || t.short === 'TEAM')) t.short = v.trim().split(/\s+/).pop().toUpperCase(); }
  else if (parts[0] === 'tc') { const t = curTeam(); let h = v.trim(); if (!h.startsWith('#')) h = '#' + h; if (/^#[0-9a-fA-F]{6}$/.test(h)) t.colors[parts[1]] = h.toUpperCase(); else { toast('Use a 6-digit hex code like #1E3A8A.'); } }
  else if (parts[0] === 'p') { const t = curTeam(); const p = t.players.find((x) => x.id === parts[1]); if (p) p[parts[2]] = parts[2] === 'num' ? v.replace(/\D/g, '').slice(0, 3) : v; rerender = parts[2] === 'num' || parts[2] === 'pos'; }
  else if (parts[0] === 'coaches' || parts[0] === 'others') { const t = curTeam(); const p = (t[parts[0]] || []).find((x) => x.id === parts[1]); if (p) p[parts[2]] = v; rerender = false; }
  save();
  if (rerender) render();
}
function toast(msg) {
  ui.toast = msg; renderLayer();
  clearTimeout(toast.t); toast.t = setTimeout(() => { ui.toast = null; renderLayer(); }, 3400);
}
function renderLayer() {
  const L = document.getElementById('layer');

  if (ui.view === 'game' && ui.g && ui.g.fo) { const fg = curGame(); if (fg) h += foModalHTML(fg); }
  if (ui.busy) h += '<div class="busy" role="status">' + esc(ui.busy) + '</div>';
  if (ui.toast) h += '<div class="toast" role="status">' + esc(ui.toast) + '</div>';
  L.innerHTML = h;
}
function render() {
  const ae = document.activeElement; const fb = ae && ae.dataset ? ae.dataset.bind : null;
  const selStart = ae && typeof ae.selectionStart === 'number' ? ae.selectionStart : null;
  let html;
  if (!db.teams.length && ui.view !== 'settings') html = shell(renderWelcome());
  else if (ui.view === 'game') html = renderGame();
  else if (ui.view === 'teams') html = shell(renderTeams());

  if (fb) { const n = document.querySelector('[data-bind="' + fb + '"]'); if (n) { n.focus(); try { if (selStart != null) n.setSelectionRange(selStart, selStart); } catch (e) { /* ignore */ } } }
  renderLayer();
}
function handleClick(e) {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a;
  const fn = GA[a] || EA[a] || RA[a] || SA[a] || A[a];

document.addEventListener('click', handleClick);
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.aChange && CHANGE[el.dataset.aChange]) { CHANGE[el.dataset.aChange](el); return; }

document.addEventListener('input', (e) => { const el = e.target; if (el.dataset && el.dataset.bind && el.dataset.bind.startsWith('ui.')) onBind(el, true); });
window.addEventListener('online', () => {

window.addEventListener('offline', () => { if (ui.end) renderLayer(); });
document.addEventListener('fullscreenchange', () => { if (ui.view === 'game') render(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch((e) => console.warn('offline setup failed', e));
